  <style>
    :root {
      --bg: #f4f2ee;
      --bg-glow: #e7e2d8;
      --card: #ffffff;
      --text: #1c1b19;
      --muted: #6b675f;
      --border: #e4e0d8;
      --btn: #ffffff;
      --btn-hover: #1c1b19;
      --btn-hover-text: #ffffff;
      --accent: #c2410c;
      --shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.06);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121212;
        --bg-glow: #1e1b17;
        --card: #1a1a1a;
        --text: #f1eee8;
        --muted: #a39e94;
        --border: #2c2b28;
        --btn: #1f1f1f;
        --btn-hover: #f1eee8;
        --btn-hover-text: #121212;
        --accent: #fb923c;
        --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Inter", system-ui, -apple-system, sans-serif;
      background: radial-gradient(ellipse at top, var(--bg-glow), var(--bg) 60%) fixed, var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    main {
      max-width: 560px;
      margin: 0 auto;
      padding: 56px 16px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .avatar {
      width: 112px;
      height: 112px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--card);
      box-shadow: var(--shadow);
    }

    h1 {
      margin-top: 18px;
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .role {
      margin-top: 4px;
      font-weight: 500;
      color: var(--muted);
    }

    .route {
      margin-top: 12px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--card);
      font-size: 0.875rem;
      font-weight: 500;
    }
    .route .arrow { color: var(--accent); }

    .bio {
      margin-top: 18px;
      color: var(--muted);
      max-width: 420px;
    }

    .links {
      list-style: none;
      width: 100%;
      margin-top: 32px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .links a {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      position: relative;
      padding: 16px 20px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--btn);
      color: var(--text);
      font-weight: 600;
      text-decoration: none;
      box-shadow: var(--shadow);
      transition: transform .15s ease, background .15s ease, color .15s ease;
    }
    .links a:hover,
    .links a:focus-visible {
      background: var(--btn-hover);
      color: var(--btn-hover-text);
      transform: translateY(-2px);
      outline: none;
    }
    .links svg { width: 20px; height: 20px; fill: currentColor; flex-shrink: 0; }

    footer {
      margin-top: 44px;
      font-size: 0.8125rem;
      color: var(--muted);
    }
  </style>
</head>

    <p class="bio">I build AI that dreams,<br />

      📷 Photography · 🥾 Hiking</p>
